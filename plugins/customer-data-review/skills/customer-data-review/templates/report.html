<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0c56d0;
  --primary-container: #dae2ff;
  --on-primary: #f8f7ff;
  --secondary-container: #e2e2e3;
  --on-secondary-container: #505253;
  --tertiary: #bb1b21;
  --surface: #f8f9fa;
  --surface-bright: #f8f9fa;
  --surface-container-low: #f1f4f6;
  --surface-container-highest: #dbe4e7;
  --outline-variant: #abb3b7;
  --slate-900: #0f172a;
  --slate-600: #475569;
  --slate-500: #64748b;
  --slate-400: #94a3b8;
  --slate-200: #e2e8f0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background-color: var(--surface);
  color: var(--slate-900);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

/* Skip link */
.skip-link {
  position: absolute; top: -40px; left: 0;
  background: var(--primary); color: var(--on-primary);
  padding: 8px 16px; z-index: 200; text-decoration: none; font-size: 14px;
}
.skip-link:focus { top: 0; }

/* Header */
header {
  position: fixed; top: 0; left: 0; right: 0; height: 64px;
  background: white; border-bottom: 4px solid var(--slate-900);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 32px; z-index: 100;
}
.header-logo {
  font-size: 14px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--slate-900);
  display: flex; align-items: center; gap: 12px;
}
.menu-toggle {
  display: none; background: none; border: none;
  cursor: pointer; padding: 4px; color: var(--slate-900);
}
.btn-primary {
  background: var(--primary); color: var(--on-primary); border: none;
  padding: 10px 24px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
  display: flex; align-items: center; gap: 10px; transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }

/* Sidebar */
aside {
  position: fixed; left: 0; top: 64px; bottom: 0; width: 256px;
  background: var(--surface-container-low);
  border-right: 1px solid rgba(171, 179, 183, 0.2);
  padding-top: 32px; z-index: 90; overflow-y: auto;
}
.sidebar-close {
  display: none; position: absolute; top: 16px; right: 16px;
  background: none; border: none; cursor: pointer; padding: 8px; color: var(--slate-500);
}
.sidebar-nav-header { padding: 0 32px; margin-bottom: 32px; }
.sidebar-nav-header h3 {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.25em; color: var(--slate-500); margin-bottom: 12px;
}
.sidebar-nav-header p {
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--slate-900);
}
.nav-link {
  display: block; padding: 14px 32px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.15em; color: var(--slate-500);
  text-decoration: none; border-left: 3px solid transparent; transition: all 0.2s;
}
.nav-link:hover, .nav-link.active {
  color: var(--primary); background: rgba(255,255,255,0.5); border-left-color: var(--primary);
}
.nav-sub-link {
  display: block; padding: 8px 32px 8px 48px; font-size: 9px; font-weight: 500;
  color: var(--slate-400); text-decoration: none; transition: all 0.2s; line-height: 1.4;
}
.nav-sub-link:hover, .nav-sub-link.active { color: var(--primary); }

/* Main */
main { margin-left: 256px; margin-top: 64px; padding-bottom: 32px; }
.section, .report-section { padding: 64px 32px; max-width: 1200px; margin: 0 auto; }

/* Hero */
.hero { background: white; padding: 40px 32px 0; }
.badge {
  display: inline-block; padding: 4px 12px;
  background: var(--secondary-container); color: var(--on-secondary-container);
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; margin-bottom: 24px;
}
.hero h1 {
  font-size: clamp(3rem, 12vw, 8rem); font-weight: 700;
  line-height: 0.85; letter-spacing: -0.05em; text-transform: uppercase;
}

/* Audit Banner (shown only when audit was skipped) */
.audit-banner {
  background: #FFF8E1;
  border-left: 4px solid #B8860B;
  padding: 16px 24px;
  margin: 0 32px 0;
  font-size: 14px;
  line-height: 1.5;
  color: #5C4A06;
}
.audit-banner strong { color: #5C4A06; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 12px; display: block; margin-bottom: 4px; }

/* Executive Summary */
.exec-summary { background: var(--surface-bright); border-top: 1px solid rgba(171,179,183,0.2); }
.section-title {
  font-size: 32px; font-weight: 700; border-bottom: 4px solid var(--slate-900);
  padding-bottom: 24px; margin-bottom: 48px; text-transform: uppercase;
}
.findings-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 64px; margin-bottom: 80px;
}
.finding-list { list-style: none; }
.finding-list h3 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.25em; margin-bottom: 32px;
  display: flex; align-items: center; gap: 12px; color: var(--primary);
}
.finding-item {
  padding-left: 24px; border-left: 2px solid var(--slate-900); margin-bottom: 32px;
}
.finding-item p { font-size: 15px; font-weight: 400; color: #1e293b; line-height: 1.6; }
.headline-text {
  font-size: 32px; font-weight: 400; line-height: 1.3; color: #1e293b; margin-bottom: 48px;
}

/* Question */
.question-section { background: white; border-top: 4px solid var(--slate-900); }
.question-meta {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--slate-400); margin-bottom: 12px;
}
.question-title {
  font-size: 40px; font-weight: 700; max-width: 800px; line-height: 1.1; margin-bottom: 64px;
}

/* Chart */
.chart-container {
  background: rgba(241,244,246,0.3); border: 1px solid rgba(171,179,183,0.1);
  padding: 40px; margin-bottom: 80px;
}
.chart-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--slate-500); margin-bottom: 40px;
}
.chart-row {
  display: grid; grid-template-columns: repeat(12, 1fr);
  align-items: center; gap: 24px; margin-bottom: 12px;
}
.chart-label {
  grid-column: span 3; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; color: #334155;
}
.chart-bar-bg { grid-column: span 8; height: 16px; background: var(--surface-container-highest); }
.chart-bar-fill { height: 100%; }
.chart-bar-fill.positive { background: #10b981; }
.chart-bar-fill.negative { background: #f43f5e; }
.chart-bar-fill.neutral { background: #94a3b8; }
.chart-bar-fill.none { background: #3b82f6; }
.chart-legend {
  display: flex; gap: 24px; margin-top: 16px; padding-top: 16px;
  border-top: 1px solid var(--slate-200); flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 8px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-500);
}
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-dot.positive { background: #10b981; }
.legend-dot.negative { background: #f43f5e; }
.legend-dot.neutral { background: #94a3b8; }
.legend-dot.none { background: #3b82f6; }
.chart-value { grid-column: span 1; font-size: 11px; font-weight: 700; text-align: right; }

/* Table */
.table-container { overflow-x: auto; margin-bottom: 80px; }
@media (max-width: 1024px) {
  .table-container { margin-bottom: 0; }
}
table { width: 100%; border-collapse: collapse; min-width: 800px; }
th {
  background: rgba(209,220,224,0.2); padding: 20px; font-size: 10px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em;
  border-bottom: 1px solid var(--slate-900); text-align: left;
}
td {
  padding: 20px; font-size: 12px;
  border-bottom: 1px solid rgba(171,179,183,0.2); vertical-align: top;
}
.theme-cell { font-weight: 700; text-transform: uppercase; }
.desc-cell { color: var(--slate-500); max-width: 250px; }
.quote-cell { font-style: italic; color: #475569; }
.table-scroll-hint { display: none; }
@media (max-width: 1024px) {
  .table-scroll-hint {
    display: flex; justify-content: flex-start; margin-top: 0; margin-bottom: 80px;
  }
  .scroll-btn {
    background: var(--surface-container-highest); border: 1px solid var(--slate-200);
    color: var(--slate-400); font-size: 9px; font-weight: 600;
    letter-spacing: 0.1em; padding: 6px 14px; cursor: pointer;
    transition: all 0.2s;
  }
  .scroll-btn:hover { color: var(--slate-900); border-color: var(--slate-400); }
}

/* Quote & Takeaways */
.takeaways-grid {
  margin-bottom: 80px;
}
.synthesis-block { margin-top: 32px; }
.quote-text {
  border-left: 5px solid var(--tertiary); padding-left: 40px;
  font-size: 32px; font-weight: 300; font-style: italic;
  line-height: 1.1; margin-bottom: 24px;
}
.quote-cite {
  display: block; margin-left: 40px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.2em; color: var(--slate-400);
}
.takeaways-box { background: var(--surface-container-highest); padding: 40px; }
.takeaways-box h4 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; margin-bottom: 32px;
}
.takeaway-item {
  display: flex; gap: 16px; margin-bottom: 24px; font-size: 14px;
  font-weight: 500; color: #1e293b; align-items: flex-start;
}
.takeaway-item::before {
  content: "\2022"; color: var(--primary); font-size: 1.5rem; line-height: 1; margin-top: -2px;
}

/* Synthesis */
.synthesis-block { margin-top: 64px; margin-bottom: 48px; }
.synthesis-block p {
  font-size: 16px; color: var(--slate-600); max-width: 1000px;
  line-height: 1.7; font-weight: 400; margin-bottom: 1rem;
}

/* Outliers */
.outliers-section { margin-top: 48px; }
.outliers-section details summary {
  list-style: none; cursor: pointer; font-size: 20px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; padding: 16px 0;
}
.outliers-section details summary::-webkit-details-marker { display: none; }
.summary-content { display: flex; align-items: center; gap: 12px; }
.dropdown-arrow { width: 12px; height: 12px; transition: transform 0.2s; flex-shrink: 0; }
details[open] .dropdown-arrow { transform: rotate(90deg); }
.outlier-card {
  background: var(--surface-container-low); padding: 16px 32px;
  border-left: 2px solid var(--slate-400);
}
.outlier-divider {
  width: 100px; border: none; border-top: 1px solid var(--slate-200);
  margin: 16px 0; margin-left: 0;
}
.outlier-quote { font-size: 14px; font-style: italic; color: #475569; margin-bottom: 16px; line-height: 1.6; }
.outlier-source {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--slate-400);
}

/* Methodology */
.methodology-section details summary { list-style: none; cursor: pointer; }
.methodology-section details summary::-webkit-details-marker { display: none; }
.methodology-section details summary .section-title {
  border-bottom: none; margin-bottom: 0; display: flex; align-items: center; gap: 12px;
}
.method-content { margin-top: 48px; }
.method-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 48px; margin-bottom: 48px;
}
.method-item { border-top: 1px solid var(--slate-200); padding-top: 32px; }
.method-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.2em; color: var(--slate-400); margin-bottom: 12px;
}
.method-value { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
.method-sub {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--slate-400); line-height: 1.6;
}

/* AI Notice */
.ai-notice {
  background: #f8fafc; padding: 40px; border-left: 8px solid var(--slate-900); max-width: 1000px;
}
.ai-notice-header { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
.ai-notice-header h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
.ai-notice-content {
  font-size: 13px; font-weight: 400; color: var(--slate-500); line-height: 1.7;
}
.ai-notice-section { margin-bottom: 32px; }
.ai-notice-section h4 {
  color: var(--slate-900); margin-bottom: 8px; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.ai-disclaimer {
  background: var(--surface-container-highest); padding: 24px; margin-bottom: 48px;
  font-size: 14px; font-weight: 500; color: var(--slate-900); line-height: 1.6;
  text-transform: none; letter-spacing: normal;
}
.ai-footer {
  border-top: 1px solid var(--slate-200); padding-top: 32px;
  color: var(--slate-900); font-size: 14px; text-transform: none; letter-spacing: -0.02em;
}

/* Footer */
footer {
  background: white; border-top: 4px solid var(--slate-900);
  padding: 48px 32px 48px 288px; display: flex;
  justify-content: space-between; align-items: flex-start;
  width: 100%; margin-top: 32px;
}
.footer-left { flex: 1; }
.footer-right { text-align: right; display: flex; flex-direction: column; gap: 12px; }
.footer-title {
  font-size: 14px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 8px;
}
.footer-left details summary { list-style: none; cursor: pointer; }
.footer-left details summary::-webkit-details-marker { display: none; }
.footer-copyright-row {
  display: flex; align-items: center; gap: 8px; font-size: 11px;
  color: var(--slate-500);
}
.license-details {
  margin-top: 24px; font-size: 11px; color: var(--slate-600); line-height: 1.6;
  max-width: 600px; white-space: pre-line; background: var(--surface-container-low); padding: 24px;
}
.footer-link-item { display: flex; flex-direction: column; gap: 4px; }
.footer-link-item a {
  font-size: 11px; font-weight: 600; color: var(--primary);
  text-decoration: none; display: flex; align-items: center; gap: 6px;
}
.icon { width: 16px; height: 16px; fill: currentColor; }

/* Focus */
a:focus, button:focus { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Responsive */
@media (max-width: 1024px) {
  .menu-toggle { display: block; }
  aside { transform: translateX(-100%); transition: transform 0.3s ease; }
  aside.open { transform: translateX(0); }
  .sidebar-close { display: block; }
  main { margin-left: 0 !important; }
  footer { padding: 48px 24px; flex-direction: column; gap: 40px; }
  .footer-right { text-align: left; align-items: flex-start; }
}
@media (max-width: 768px) {
  .takeaways-box { padding: 24px; }
  .quote-text { font-size: 24px; padding-left: 24px; }
  .quote-cite { margin-left: 24px; }
}
@media (max-width: 640px) {
  header { padding: 0 16px; height: 72px; }
  .header-logo { font-size: 11px; line-height: 1.1; }
  .btn-primary { padding: 8px 16px; font-size: 9px; }
  main { margin-top: 72px; }
  .section, .report-section { padding: 40px 16px; }
  .hero { padding: 32px 16px 0; }
  .section-title { font-size: 24px; margin-bottom: 32px; }
  .question-title { font-size: 28px; margin-bottom: 32px; }
  .findings-grid { gap: 32px; margin-bottom: 48px; }
  .chart-container { padding: 24px 16px; margin-bottom: 48px; }
  .chart-row {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 8px; margin-bottom: 24px;
  }
  .chart-label, .chart-bar-bg, .chart-value { width: 100%; }
  .chart-value { text-align: left; }
  .chart-legend { gap: 16px; }
  .headline-text { font-size: 22px; margin-bottom: 32px; }
}

/* Print */
@media print {
  header, aside, .skip-link, .btn-primary, .menu-toggle { display: none !important; }
  main { margin-left: 0 !important; margin-top: 0 !important; }
  footer { padding-left: 32px; }
  .question-section { break-inside: avoid; }
  .chart-container { break-inside: avoid; }
  body { background: white; }
}
</style>
</head>
<body>
{{SKIP_LINK}}
<header>
  <div class="header-logo">
    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    Customer Feedback Analysis
  </div>
  <button class="btn-primary" id="download-btn" aria-label="Download report">
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download Report
  </button>
</header>

<aside id="sidebar">
  <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  {{SIDEBAR_NAV}}
</aside>

<main id="main-content">
  {{HERO_SECTION}}
  {{AUDIT_BANNER}}
  {{EXECUTIVE_SUMMARY}}
  {{QUESTIONS_SECTIONS}}
  {{METHODOLOGY_SECTION}}
</main>

{{FOOTER}}

<script>
document.addEventListener('DOMContentLoaded', () => {
  const sections = document.querySelectorAll('section[id], div[id]');
  const navLinks = document.querySelectorAll('.nav-link, .nav-sub-link');
  const sidebar = document.getElementById('sidebar');
  const headerHeight = 64;

  function updateActiveLink() {
    let currentSectionId = '';
    let minDistance = Infinity;
    sections.forEach(section => {
      const rect = section.getBoundingClientRect();
      const distance = Math.abs(rect.top - headerHeight - 20);
      if (rect.top < window.innerHeight / 2 && rect.bottom > headerHeight) {
        if (distance < minDistance) {
          minDistance = distance;
          currentSectionId = section.getAttribute('id');
        }
      }
    });
    if (currentSectionId) {
      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href') === '#' + currentSectionId) {
          link.classList.add('active');
        }
      });
      const activeSubLink = document.querySelector('.nav-sub-link.active');
      if (activeSubLink) {
        const questionsLink = document.querySelector('.nav-link[href="#questions"]');
        if (questionsLink) questionsLink.classList.add('active');
      }
    }
  }
  window.addEventListener('scroll', updateActiveLink);
  updateActiveLink();

  navLinks.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      if (window.innerWidth <= 1024) sidebar.classList.remove('open');
      const targetId = link.getAttribute('href').substring(1);
      const targetElement = document.getElementById(targetId);
      if (targetElement) {
        const offsetTop = targetElement.getBoundingClientRect().top + window.pageYOffset - headerHeight;
        window.scrollTo({ top: offsetTop, behavior: 'smooth' });
      }
    });
  });

  const menuToggle = document.getElementById('menu-toggle');
  const sidebarClose = document.getElementById('sidebar-close');
  if (menuToggle && sidebar) menuToggle.addEventListener('click', () => sidebar.classList.add('open'));
  if (sidebarClose && sidebar) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));

  const downloadBtn = document.getElementById('download-btn');
  if (downloadBtn) {
    downloadBtn.addEventListener('click', () => {
      const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'report.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  }

  // Table scroll hint buttons — toggle direction on scroll
  document.querySelectorAll('.scroll-btn').forEach(btn => {
    const wrapper = btn.closest('.table-scroll-hint');
    const container = wrapper ? wrapper.previousElementSibling : null;
    if (!container || !container.classList.contains('table-container')) return;
    let atEnd = false;
    container.addEventListener('scroll', () => {
      const maxScroll = container.scrollWidth - container.clientWidth;
      atEnd = container.scrollLeft >= maxScroll - 2;
      btn.innerHTML = atEnd ? '&larr; SCROLL' : 'SCROLL &rarr;';
    });
    btn.addEventListener('click', () => {
      if (atEnd) {
        container.scrollTo({ left: 0, behavior: 'smooth' });
      } else {
        container.scrollTo({ left: container.scrollWidth, behavior: 'smooth' });
      }
    });
  });
});
</script>
</body>
</html>
